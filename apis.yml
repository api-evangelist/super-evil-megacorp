aid: super-evil-megacorp
name: Super Evil Megacorp
description: Super Evil Megacorp is an award-winning independent video game studio building
  shared, cross-platform gaming experiences that push creative and technical boundaries.
  Founded in 2012, the studio is best known for the mobile MOBA Vainglory and has since
  shipped titles including Catalyst Black, TMNT Splintered Fate, and Blood Line - Rebel Moon,
  developed on its own in-house game engine. The company was surfaced as a portfolio company
  of a16z and Index Ventures; it is a consumer games studio and publishes no public developer
  API, SDK, or developer portal.
